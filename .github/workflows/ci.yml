name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'   # daily rebuild so the CFB target counts stay current
permissions: { contents: read }
jobs:
  build-test:
    runs-on: ubuntu-latest
    concurrency: { group: 'build-${{ github.ref }}', cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Build
        run: python3 tools/build.py
      - name: Restore CFB targets cache
        uses: actions/cache@v4
        with:
          path: .cache/cfb_targets.json
          key: cfb-targets-${{ github.run_id }}
          restore-keys: cfb-targets-
      - name: Count CFB pass targets from play-by-play
        continue-on-error: true
        run: |
          mkdir -p .cache dist/cfb
          python3 tools/build_cfb_targets.py .cache/cfb_targets.json dist/cfb/targets.json 1200
      - name: Lint for undefined identifiers
        run: |
          for s in mlb nhl nba nfl; do node --expose-internals tools/lint_globals.js dist/assets/core.js dist/$s/sport.js; done
      - name: Smoke tests (mocked feeds)
        run: |
          python3 tests/smoke_landing.py
          python3 tests/smoke_mlb.py / /stats/bat /player/1000 /team/108 /teams /compare
          for s in nhl nba nfl; do python3 tests/smoke_espn.py $s; done
      - name: Real-shape fixture tests
        run: |
          node tests/test_real_shapes.js
          python3 tests/test_targets.py
          python3 tests/test_podium_real.py
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: dist }
  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: pages, cancel-in-progress: false }
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
